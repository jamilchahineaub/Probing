[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-aerial-probing"
version = "0.1.0"
description = "Research code for bounded aerial probing of uncertain targets"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.5",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=6.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
