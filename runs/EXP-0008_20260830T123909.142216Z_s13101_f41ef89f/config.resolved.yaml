experiment:
  id: EXP-0008
  title: 6-DoF Coupled UAV Contact Baseline
  stage: 3A
  scientific_question: Does the bounded probe plus passive ring-down SAFE/NON-SAFE
    signal survive when probing is generated by a dynamically controlled 6-DoF quadrotor
    and contact forces feed back into the vehicle?
