  motor_time_constant_s: 0.03
  minimum_rotor_speed_rad_s: 0.0
  maximum_rotor_speed_rad_s: 900.0
  parameter_basis: Symmetric 1.5 kg research quadrotor assumption with a 0.46 m motor
    span; coefficients give 440 rad/s nominal hover and about 4.18 hover-thrust multiples
    at the speed limit. Values are prospective baseline assumptions, not fitted to
    probing results.
controller:
  architecture: cascaded position-velocity plus geometric attitude/body-rate
  position_p:
  - 4.0
  - 4.0
  - 6.0
  velocity_d:
  - 4.0
  - 4.0
  - 5.0
  attitude_p:
  - 1.8
  - 1.8
  - 1.2
  body_rate_d:
  - 0.35
  - 0.35
  - 0.4
  maximum_acceleration_m_per_s2: 8.0
  force_feedback_gain: 0.1
  force_admittance_gain_m_per_n_s: 0.04
  force_admittance_position_limit_m: 0.025
  maximum_normal_feedforward_force_n: 1.25
  normal_force_servo_sign: Signed vehicle propulsion along the surface normal is allowed
    so the UAV can unload and separate; the unilateral contact law still prohibits
    any tensile target force.
  contact_torque_compensation: Measured normal contact force and known rigid-probe
    geometry provide the algebraic r cross F disturbance torque. The inner loop subtracts
    this measured disturbance from its rotor-torque command; attitude feedback remains
    active and the contact wrench still enters the rigid-body dynamics.
  passive_retraction_m: 0.006
  gains_fixed_before_coupled_target_sweep: true
  gain_basis: Position damping is near critical for the selected position stiffness.
    Attitude gains use the nominal inertia to place roll/pitch near 7.9 rad/s and
    yaw near 4.7 rad/s with approximately 0.8 damping. These gains were fixed after
    no-contact step validation and before any contact trial. The contact loop uses
    low-gain signed force feedback plus a bounded admittance position state; its 0.10
    force gain stays below the observed high-frequency interface/motor instability
    onset, while the admittance supplies low-frequency unloading without tensile contact.
    Anti-windup restricts the admittance integrator to excess-force unloading; positive
    force error is handled by bounded feedforward and cannot accumulate an arbitrary
    penetration command.
