schema_version: 1
experiment:
  id: EXP-0001
  title: Milestone A bounded interaction identification
  stage: A
  scientific_question: Can k, c, and m_eff of an unknown interaction target be identified
    from a small bounded probing interaction under ideal or near-ideal measurements?
  hypothesis: The linear interaction parameters will be independently recoverable
    by batch least squares and RLS when the sampled response regression has full rank
    and acceptable normalized conditioning. Probe-dependent correlation and failures
    will be reported rather than repaired by estimator tuning.
  seed_set: development
  random_seed: 1101
simulation:
  model: one_dimensional_mass_spring_damper
  equation: F = m_eff*x_ddot + c*x_dot + k*x
  integrator: rk4
  sample_period_s: 0.002
  duration_s: 3.0
  initial_displacement_m: 0.0
  initial_velocity_m_per_s: 0.0
targets:
- name: rigid_high_stiffness
  stiffness_n_per_m: 2000.0
  damping_n_s_per_m: 20.0
  effective_mass_kg: 1.0
- name: compliant
  stiffness_n_per_m: 100.0
  damping_n_s_per_m: 5.0
  effective_mass_kg: 1.0
- name: lightly_damped_flexible
  stiffness_n_per_m: 300.0
  damping_n_s_per_m: 0.5
  effective_mass_kg: 1.0
- name: high_damping
  stiffness_n_per_m: 300.0
  damping_n_s_per_m: 50.0
  effective_mass_kg: 1.0
- name: low_effective_mass
  stiffness_n_per_m: 300.0
  damping_n_s_per_m: 5.0
  effective_mass_kg: 0.1
- name: high_effective_mass
  stiffness_n_per_m: 300.0
  damping_n_s_per_m: 5.0
  effective_mass_kg: 5.0
probes:
- name: ramp
  amplitude_n: 1.0
  rise_duration_s: 0.75
- name: half_sine
  amplitude_n: 1.0
  pulse_duration_s: 1.0
- name: sinusoid
  amplitude_n: 1.0
  frequency_hz: 2.0
- name: chirp
  amplitude_n: 1.0
  start_frequency_hz: 0.5
  end_frequency_hz: 10.0
- name: multisine
  amplitude_n: 1.0
  frequencies_hz:
  - 0.5
  - 1.5
  - 4.0
  - 8.0
  weights:
  - 1.0
  - 1.0
  - 1.0
  - 1.0
  phases_rad:
  - 0.0
  - 0.7
  - 1.4
  - 2.1
measurement_scenarios:
- name: perfect
  seed_offset: 0
  noise:
    displacement_std_m: 0.0
    velocity_std_m_per_s: 0.0
    acceleration_std_m_per_s2: 0.0
    force_std_n: 0.0
- name: near_ideal
  seed_offset: 10000
  noise:
    displacement_std_m: 1.0e-06
    velocity_std_m_per_s: 0.0001
    acceleration_std_m_per_s2: 0.005
    force_std_n: 0.001
estimators:
  batch_least_squares:
    regularization: none
  recursive_least_squares:
    forgetting_factor: 1.0
    initial_covariance: 1.0e10
    initial_parameters:
    - 0.0
    - 0.0
    - 0.0
    feature_preconditioning: rms
safety_limits:
  max_abs_probe_force_n: 1.000000000001
  max_abs_displacement_m: 0.025
  max_abs_velocity_m_per_s: 0.5
  max_abs_acceleration_m_per_s2: 15.0
acceptance:
  perfect_scenario: perfect
  near_ideal_scenario: near_ideal
  max_normalized_condition_number: 1000.0
  max_perfect_batch_relative_error_rms: 1.0e-09
  max_perfect_rls_relative_error_rms: 1.0e-06
  max_near_ideal_batch_median_relative_error_rms: 0.15
  max_near_ideal_rls_median_relative_error_rms: 0.15
plotting:
  representative_case:
    scenario: near_ideal
    target: compliant
    probe: chirp
scope_exclusions:
- Gazebo
- PX4
- ROS 2
- MPC
- Isaac Sim
- full quadrotor dynamics
