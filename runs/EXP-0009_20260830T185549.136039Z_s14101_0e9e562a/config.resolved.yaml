controller_development_audit:
  held_out_targets_seen: false
  classifier_evaluated: false
  selected_architecture: Direct bounded force feedforward plus target-velocity and
    interface-force- derivative feedforward, slow contact acquisition, a 0.50 N preload,
    and raised-cosine controlled unload.
  explored_on_development_targets_only:
  - force PI and admittance corrections
  - acceleration-matching force control
  - target-acceleration following
  - position and velocity gain variations
  - acquisition force and dwell variations
  - separated-contact recovery thrust
  - actuator-side force-command caps from 0.50 N to 1.00 N
  rejected_behaviors:
  - repeated acquisition chatter or timeout
  - impact-force growth
  - probe separation and recontact
  - realized force above the 1.50 N abort bound
  freeze_reason: 'The selected controller was the safest interpretable development
    candidate: it completed four of eight declared targets with uninterrupted PROBE
    contact and zero passive force, while the four difficult compliant/high- mass/boundary
    cases aborted on the prospectively defined acquisition timeout. Higher force-command
    caps increased impact, separation, and aborts instead of improving faithful delivery.
    These failures are retained rather than weakening the stable-contact dwell or
    safety limits.'
