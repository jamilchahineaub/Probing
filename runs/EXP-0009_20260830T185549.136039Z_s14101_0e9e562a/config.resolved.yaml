  justification: Gates preserve the existing 1.25 N physical force limit and require
    roughly a factor-of-two RMS/lag improvement over EXP-0008, contact retention in
    at least 90 percent of trials, extension of useful delivery from about 2 Hz to
    3 Hz, ample rotor reserve, and a passive window whose residual force is small
    relative to the 0.5 N probing amplitude. They demand substantial improvement without
    assuming perfect 5 Hz tracking.
