schema_version: 1

experiment:
  id: EXP-0002
  title: Stage 1 realistic sensing and practical identifiability stress test
  stage: 1
  scientific_question: >-
    Does identification of k, c, and m_eff remain reliable when the
    measurements and contact assumptions become closer to what an actual
    aerial robot could obtain?
  hypothesis: >-
    At least one broadband bounded probe and common practical sensing pipeline
    will retain useful stiffness and damping identification without direct
    acceleration, while effective mass will be more sensitive to derivative
    noise, timing mismatch, and errors-in-variables bias.
  seed_set: validation

validation_seeds: [2101, 2102, 2103, 2104, 2105, 2106, 2107, 2108, 2109, 2110]

exp_0001_reference:
  run_id: EXP-0001_20260828T204945.797835Z_s1101_4eb1fe69
  raw_npz: runs/EXP-0001_20260828T204945.797835Z_s1101_4eb1fe69/raw_timeseries.npz
  case_metrics_csv: results/tables/EXP-0001_20260828T204945.797835Z_s1101_4eb1fe69__case_metrics.csv
  expected_artifact_fingerprint: fc8d3375b320d6fa81843a5dc8819f17de7ea36c50f1a258bc6e0578f88aba39

simulation:
  model: one_dimensional_mass_spring_damper
  equation: F_contact = m_eff*x_ddot + c*x_dot + k*x
  integrator: rk4
  sample_period_s: 0.002
  duration_s: 3.0

targets:
  - name: rigid_high_stiffness
    stiffness_n_per_m: 2000.0
    damping_n_s_per_m: 20.0
    effective_mass_kg: 1.0
  - name: compliant
    stiffness_n_per_m: 100.0
    damping_n_s_per_m: 5.0
    effective_mass_kg: 1.0
  - name: lightly_damped_flexible
    stiffness_n_per_m: 300.0
    damping_n_s_per_m: 0.5
    effective_mass_kg: 1.0
  - name: high_damping
    stiffness_n_per_m: 300.0
    damping_n_s_per_m: 50.0
    effective_mass_kg: 1.0
  - name: low_effective_mass
    stiffness_n_per_m: 300.0
    damping_n_s_per_m: 5.0
    effective_mass_kg: 0.1
  - name: high_effective_mass
    stiffness_n_per_m: 300.0
    damping_n_s_per_m: 5.0
    effective_mass_kg: 5.0

probes:
  - name: ramp
    amplitude_n: 1.0
    rise_duration_s: 0.75
  - name: half_sine
    amplitude_n: 1.0
    pulse_duration_s: 1.0
  - name: sinusoid
    amplitude_n: 1.0
    frequency_hz: 2.0
  - name: chirp
    amplitude_n: 1.0
    start_frequency_hz: 0.5
    end_frequency_hz: 10.0
  - name: multisine
    amplitude_n: 1.0
    frequencies_hz: [0.5, 1.5, 4.0, 8.0]
    weights: [1.0, 1.0, 1.0, 1.0]
    phases_rad: [0.0, 0.7, 1.4, 2.1]

contact_modes: [bilateral, unilateral]

sensing_regimes:
  - name: optimistic_reference
    description: Direct displacement, velocity, acceleration, and force.
    pipelines: [direct]
  - name: no_direct_velocity
    description: Velocity is derived from position; acceleration and force are measured.
    pipelines: [finite_difference, low_pass, savitzky_golay]
  - name: no_direct_acceleration
    description: Velocity and acceleration are both derived from measured position.
    pipelines: [finite_difference, low_pass, savitzky_golay]
  - name: imu_like
    description: Lower-rate position and noisy acceleration with complementary velocity fusion.
    pipelines: [finite_difference, low_pass, savitzky_golay]
  - name: sensorless_force_exploratory
    description: IMU-like kinematics with delayed filtered command-based force proxy; excluded from GO.
    pipelines: [savitzky_golay]

imperfection_severities:
  - name: mild
    severity_index: 1
    sample_rate_hz: 250.0
    position_sample_rate_hz: 50.0
    displacement_std_m: 5.0e-6
    velocity_std_m_per_s: 5.0e-4
    acceleration_std_m_per_s2: 0.02
    force_std_n: 0.005
    position_latency_s: 0.002
    acceleration_latency_s: 0.001
    force_latency_s: 0.003
    timestamp_mismatch_std_s: 0.0005
    sensorless_command_latency_s: 0.005
  - name: nominal
    severity_index: 2
    sample_rate_hz: 100.0
    position_sample_rate_hz: 25.0
    displacement_std_m: 5.0e-5
    velocity_std_m_per_s: 0.002
    acceleration_std_m_per_s2: 0.1
    force_std_n: 0.02
    position_latency_s: 0.010
    acceleration_latency_s: 0.005
    force_latency_s: 0.012
    timestamp_mismatch_std_s: 0.002
    sensorless_command_latency_s: 0.015
  - name: severe
    severity_index: 3
    sample_rate_hz: 50.0
    position_sample_rate_hz: 10.0
    displacement_std_m: 2.0e-4
    velocity_std_m_per_s: 0.010
    acceleration_std_m_per_s2: 0.5
    force_std_n: 0.05
    position_latency_s: 0.030
    acceleration_latency_s: 0.015
    force_latency_s: 0.040
    timestamp_mismatch_std_s: 0.008
    sensorless_command_latency_s: 0.050

pipeline_settings:
  low_pass_cutoff_hz: 10.0
  savgol_window_duration_s: 0.12
  savgol_polynomial_order: 3
  complementary_time_constant_s: 0.20
  sensorless_force_cutoff_hz: 10.0

estimators:
  primary: unregularized_batch_least_squares
  recursive_baseline: rls
  forgetting_factor: 1.0
  initial_covariance: 1.0e10
  initial_parameters: [0.0, 0.0, 0.0]
  rls_convergence_tolerance: 0.20
  alternate_parameterization: [natural_frequency, damping_ratio, inverse_mass]

information_metrics:
  displacement_reference_m: 0.01
  energy_reference_j: 0.01
  disclaimer: Heuristic normalized comparison metrics; not claimed information-optimal.

safety_limits:
  max_peak_force_n: 1.000000000001
  max_peak_target_displacement_m: 0.025
  max_peak_target_velocity_m_per_s: 0.5
  max_peak_target_acceleration_m_per_s2: 15.0

go_no_go:
  severity: nominal
  contact_mode: unilateral
  practical_regimes: [no_direct_acceleration, imu_like]
  max_stiffness_p95_abs_relative_error: 0.20
  max_damping_p95_abs_relative_error: 0.30
  max_effective_mass_p95_abs_relative_error: 0.30
  max_stiffness_abs_relative_bias: 0.10
  max_damping_abs_relative_bias: 0.15
  max_effective_mass_abs_relative_bias: 0.15
  min_full_rank_fraction: 0.99
  max_peak_force_n: 1.000000000001
  max_peak_target_displacement_m: 0.025
  decision_rule: >-
    GO only if one probe plus practical no-direct-acceleration or IMU-like
    pipeline passes every target-wise 95th-percentile, bias, observability, and
    disturbance threshold under nominal unilateral contact. Exploratory
    sensorless-force cases cannot trigger GO.

integrity_acceptance:
  minimum_monte_carlo_seeds: 10

representative_raw:
  target_probe_pairs:
    - target: rigid_high_stiffness
      probe: ramp
    - target: compliant
      probe: chirp

scope_exclusions:
  - MATLAB
  - Simulink
  - EKF
  - UAV dynamics
  - Gazebo
  - PX4
  - ROS 2
  - MPC
  - Isaac Sim
