    exp_0007: 6fad8bf7508908814acce9c190fb1a53053be780930ea702106d062059ea00f3

frames:
  world: ENU, z up
  body: FLU, x forward, y left, z up
  quaternion: scalar-first Hamilton q_WB rotating body vectors into world
  target_normal: positive world x
  force_sign: positive contact force pushes target along positive normal

simulation:
  integration: fixed-step classical RK4
  integration_step_s: 0.001
  recorded_sample_period_s: 0.002
  maximum_experiment_duration_s: 8.0

vehicle:
  mass_kg: 1.50
  inertia_body_kg_m2: [[0.029, 0.0, 0.0], [0.0, 0.029, 0.0], [0.0, 0.0, 0.055]]
  center_of_mass_body_m: [0.0, 0.0, 0.0]
  arm_length_m: 0.23
  rotor_numbering: [front, left, rear, right]
  rotor_positions_body_m: [[0.23, 0.0, 0.0], [0.0, 0.23, 0.0], [-0.23, 0.0, 0.0], [0.0, -0.23, 0.0]]
  rotor_spin_directions: [1, -1, 1, -1]
  thrust_coefficient_n_per_rad2: 1.90e-5
  reaction_torque_coefficient_nm_per_rad2: 2.60e-7
  motor_time_constant_s: 0.030
  minimum_rotor_speed_rad_s: 0.0
  maximum_rotor_speed_rad_s: 900.0

vehicle_controller:
  architecture: cascaded position-velocity plus geometric attitude/body-rate
  position_p: [3.0, 4.0, 6.0]
  velocity_d: [3.5, 4.0, 5.0]
  attitude_p: [8.0, 8.0, 1.2]
  body_rate_d: [0.70, 0.70, 0.40]
  maximum_acceleration_m_per_s2: 8.0
  contact_torque_compensation: true

probe_geometry:
  tip_offset_body_m: [0.30, 0.0, -0.08]
  probe_length_m: 0.30
  probe_mass_kg: 0.0
  structure: rigid

contact:
  mode: unilateral
  surface_origin_world_m: [0.0, 0.0, 0.92]
  normal_world: [1.0, 0.0, 0.0]
  interface_stiffness_n_per_m: 5000.0
  interface_damping_n_s_per_m: 10.0
  friction_coefficient: 0.0

locked_probe:
  type: linear_frequency_chirp
  amplitude_n: 0.5
  start_frequency_hz: 0.5
  end_frequency_hz: 5.0
  duration_s: 3.0
  observation_duration_s: 0.5
  passive_force_n: 0.0
  source_definition: src/probeing/experiments/coupled_uav_contact.py::locked_probe_force

hybrid_controller:
  status: development
  allowed_states: [APPROACH, CONTACT_ACQUIRE, PRELOAD, PROBE, CONTROLLED_UNLOAD, PASSIVE_OBSERVE, DECISION, ABORT]
  initial_clearance_m: 0.010
  approach_velocity_m_per_s: 0.006
  maximum_approach_velocity_m_per_s: 0.008
  contact_detection_force_n: 0.03
  acquisition_force_n: 0.12
  acquisition_minimum_dwell_s: 0.20
  acquisition_force_error_n: 0.08
  acquisition_relative_velocity_m_per_s: 0.015
  acquisition_timeout_s: 1.0
  preload_force_n: 0.30
  preload_ramp_duration_s: 0.40
  preload_minimum_dwell_s: 0.30
  preload_force_error_n: 0.10
  preload_relative_velocity_m_per_s: 0.020
  preload_timeout_s: 1.5
  unload_duration_s: 0.40
  passive_retraction_m: 0.010
  decision_hold_s: 0.05
  force_feedforward_error_gain: 0.35
  force_position_proportional_m_per_n: 0.0015
  force_position_integral_m_per_n_s: 0.010
  force_position_integral_limit_m: 0.010
  maximum_position_correction_m: 0.012
  minimum_force_command_n: -0.20
  maximum_force_command_n: 1.10
  near_loss_force_n: 0.08
  near_loss_closing_speed_m_per_s: -0.005
  retention_force_boost_n: 0.12
  retention_position_boost_m: 0.0005
  maximum_commanded_normal_velocity_m_per_s: 0.08
  maximum_commanded_normal_acceleration_m_per_s2: 2.0
  abort_force_n: 1.25
  abort_attitude_deg: 15.0
  abort_penetration_m: 0.002
  transition_parameters_may_change_on_development_targets_only: true

development_population:
  seeds: [14001]
  targets:
    - {name: stiff, stiffness_n_per_m: 2200.0, damping_n_s_per_m: 12.0, effective_mass_kg: 1.2}
    - {name: compliant, stiffness_n_per_m: 90.0, damping_n_s_per_m: 3.0, effective_mass_kg: 1.2}
    - {name: lightly_damped, stiffness_n_per_m: 450.0, damping_n_s_per_m: 0.5, effective_mass_kg: 1.0}
    - {name: highly_damped, stiffness_n_per_m: 450.0, damping_n_s_per_m: 55.0, effective_mass_kg: 1.0}
    - {name: low_mass, stiffness_n_per_m: 450.0, damping_n_s_per_m: 8.0, effective_mass_kg: 0.12}
    - {name: high_mass, stiffness_n_per_m: 450.0, damping_n_s_per_m: 8.0, effective_mass_kg: 5.5}
    - {name: exp0008_boundary, stiffness_n_per_m: 170.0, damping_n_s_per_m: 2.0, effective_mass_kg: 2.5}
    - {name: contact_loss_stress, stiffness_n_per_m: 120.0, damping_n_s_per_m: 0.45, effective_mass_kg: 3.8}

held_out_population:
  broad_seeds: [14101, 14102, 14103, 14104, 14105, 14106]
  broad_cases_per_seed: 25
  boundary_seeds: [14201, 14202, 14203]
  boundary_cases_per_seed: 30
  target_count: 240
  stiffness_n_per_m: [75.0, 2500.0]
  damping_n_s_per_m: [0.3, 60.0]
  effective_mass_kg: [0.10, 6.0]
  boundary_generation: prospective candidates selected by frozen reduced-order severity ratio, without coupled-controller outcomes
  noise_regimes: [low, nominal, high]
  measurement_seed_offset: 15000000

sensing:
  source: frozen EXP-0006 causal_low_pass assumptions
  sample_rate_hz: 200.0
  synchronized: true
  low_pass_cutoff_hz: 10.0
  base_noise: {displacement_std_m: 5.0e-5, velocity_std_m_per_s: 0.002, acceleration_std_m_per_s2: 0.1, force_std_n: 0.02}
  noise_multipliers: {low: 0.5, nominal: 1.0, high: 2.0}

prospective_delivery_gates:
  population_peak_force_p99_n: 1.25
  absolute_peak_force_n: 1.50
  zero_separation_during_probe_fraction: 0.90
  median_separation_count_during_probe: 0.0
  p95_separation_count_during_probe: 1.0
  passive_recontact_trial_fraction: 0.05
  median_rms_force_error_n: 0.20
  p95_rms_force_error_n: 0.35
  median_normalized_rms_force_error: 0.75
  median_absolute_lag_s: 0.10
  p95_absolute_lag_s: 0.175
  median_faithful_bandwidth_hz: 3.0
  no_faithful_bin_fraction: 0.10
  first_contact_peak_force_n: 0.75
  first_contact_impulse_n_s: 0.03
  recontact_peak_force_n: 1.25
  absolute_unload_impulse_n_s: 0.10
  minimum_actuator_reserve: 0.25
  motor_saturation_fraction: 0.01
  maximum_attitude_deg: 10.0
  passive_residual_force_rms_n: 0.03
  passive_force_squared_energy_n2_s: 0.0005
  zero_probe_command_during_passive: true
  justification: >-
    Gates preserve the existing 1.25 N physical force limit and require roughly
    a factor-of-two RMS/lag improvement over EXP-0008, contact retention in at
    least 90 percent of trials, extension of useful delivery from about 2 Hz to
    3 Hz, ample rotor reserve, and a passive window whose residual force is
    small relative to the 0.5 N probing amplitude. They demand substantial
    improvement without assuming perfect 5 Hz tracking.

policy_evaluation_gate:
  policy_is_evaluated_only_after_controller_freeze: true
  nominal_false_safe_rate: 0.01
  high_noise_false_safe_rate: 0.02
  boundary_false_safe_rate: 0.02
  interpretation: >-
    These retain the Stage 1 point-estimate safety requirements. Confidence
    bounds are always reported, but EXP-0009 is not required to reproduce the
    Stage 2 point estimates merely to count as a valid controller experiment.

scope_exclusions:
  - any safety-policy refit, threshold change, or feature change
  - chirp or observation-duration change
  - vehicle, rotor, target, probe, or contact-physics redesign
  - Gazebo
  - PX4
  - ROS 2
  - MPC
  - reinforcement learning
  - Isaac Sim
  - camera perception
  - hardware integration
