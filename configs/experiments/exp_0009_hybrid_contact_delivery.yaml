  stage2_commit: 95fcdbb5d08f2ffa46077aced7f5c882fb2627f8
  locked_policy_bundle: configs/policies/exp_0007_locked_exp_0006_policy.json
  locked_policy_sha256: 7cc1669f897ea1c917b5f3b289412bdbbc0187ac9a3979ca38240078f1d8c015
  stage1_fingerprints:
    exp_0001: fc8d3375b320d6fa81843a5dc8819f17de7ea36c50f1a258bc6e0578f88aba39
    exp_0002: f01de13653e8ae65b143b88db3c008a456d4a4239559c5fcb39ab77922f32efc
    exp_0003: 067d0a7669da40c3d49401fbff6ca70abf2b941f7bab5626296d1e65545b84a8
