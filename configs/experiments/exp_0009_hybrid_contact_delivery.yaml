schema_version: 1
experiment:
  id: EXP-0009
  title: Hybrid Contact-Retention and Bounded Force Delivery
  stage: 3A
  scientific_question: >-
    Can a prospectively designed hybrid contact-retention and force-delivery
    controller physically deliver the frozen probing experiment without
    repeated separation/recontact, excessive impact forces, or
    controller-induced settling?

frozen_references:
  exp_0008_commit: a2058df8c584264358a7aee191ed2d544515144e
  exp_0008_tag: exp-0008-complete-20260830
